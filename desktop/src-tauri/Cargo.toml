[package]
name = "homechat-desktop"
version = "0.15.0"
description = "HomeChat Windows desktop client"
authors = ["HomeChat"]
edition = "2021"

[lib]
name = "homechat_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
