services:
  homechat:
    build: .
    container_name: homechat
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      DATA_DIR: /app/data
      UPLOAD_DIR: /app/data/uploads
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-104857600}
      SESSION_DAYS: ${SESSION_DAYS:-30}
      HTTP_PORT: 3000
      HTTPS_PORT: 3001
      PUBLIC_HTTPS_PORT: ${HOMECHAT_HTTPS_PORT:-8093}
      HOMECHAT_HOST: ${HOMECHAT_HOST:-localhost}
      HOMECHAT_AUTO_TLS: ${HOMECHAT_AUTO_TLS:-true}
      HOMECHAT_ADMIN_NAME: ${HOMECHAT_ADMIN_NAME:-}
      HOMECHAT_ADMIN_PASSWORD: ${HOMECHAT_ADMIN_PASSWORD:-}
      HOMECHAT_ADMIN_PASSWORD_FILE: ${HOMECHAT_ADMIN_PASSWORD_FILE:-}
      HOMECHAT_VAPID_SUBJECT: ${HOMECHAT_VAPID_SUBJECT:-mailto:homechat@example.invalid}
    volumes:
      - ${HOMECHAT_DATA_PATH:-homechat-data}:/app/data
    ports:
      - "${HOMECHAT_HTTP_PORT:-8092}:3000"
      - "${HOMECHAT_HTTPS_PORT:-8093}:3001"

volumes:
  homechat-data:
