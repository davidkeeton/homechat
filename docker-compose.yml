services:
  homechat:
    build: .
    container_name: homechat
    restart: unless-stopped
    environment:
      TZ: America/Vancouver
      DATA_DIR: /app/data
      UPLOAD_DIR: /app/data/uploads
      MAX_UPLOAD_BYTES: 104857600
      SESSION_DAYS: 30
      HTTP_PORT: 3000
      HTTPS_PORT: 3001
      PUBLIC_HTTPS_PORT: 8093
      TLS_CERT_FILE: /app/data/tls/homechat.crt
      TLS_KEY_FILE: /app/data/tls/homechat.key
      CA_CERT_FILE: /app/data/tls/homechat-root-ca.crt
    volumes:
      - /home/dkeeton/docker/appdata/homechat:/app/data
    ports:
      - "8092:3000"
      - "8093:3001"
