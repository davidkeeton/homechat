name: Build Windows client

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install web client dependencies
        shell: bash
        run: npm install --prefix client

      - name: Install desktop dependencies
        shell: bash
        run: npm install --prefix desktop

      - name: Build HomeChat Windows client
        shell: bash
        run: npm --prefix desktop run build

      - name: Prepare predictable installer filename
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $installer = Get-ChildItem "desktop/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced." }
          Copy-Item $installer.FullName "dist/HomeChat-Windows-Setup.exe" -Force

          $msi = Get-ChildItem "desktop/src-tauri/target/release/bundle/msi/*.msi" | Select-Object -First 1
          if ($msi) {
            Copy-Item $msi.FullName "dist/HomeChat-Windows.msi" -Force
          }

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: homechat-windows
          if-no-files-found: error
          path: |
            dist/HomeChat-Windows-Setup.exe
            dist/HomeChat-Windows.msi

      - name: Create or update latest Windows client release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view windows-client-latest --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create windows-client-latest `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title "HomeChat Windows Client" `
              --notes "Latest manually built HomeChat Windows client."
          }

          gh release upload windows-client-latest `
            "dist/HomeChat-Windows-Setup.exe" `
            --clobber `
            --repo $env:GITHUB_REPOSITORY

          if (Test-Path "dist/HomeChat-Windows.msi") {
            gh release upload windows-client-latest `
              "dist/HomeChat-Windows.msi" `
              --clobber `
              --repo $env:GITHUB_REPOSITORY
          }
